[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
# 100 keeps VaultFactory (which embeds the ERC20YieldVault initcode) under the
# EIP-170 runtime size limit; runtime gas cost on the hot paths moves <1%.
optimizer_runs = 100

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
rootstock_testnet = "${ROOTSTOCK_TESTNET_RPC}"
rootstock_mainnet = "${ROOTSTOCK_MAINNET_RPC}"

[etherscan]
rootstock_testnet = { key = "rootstock", chain = 31, url = "https://rootstock-testnet.blockscout.com/api/" }
rootstock_mainnet = { key = "rootstock", chain = 30, url = "https://rootstock.blockscout.com/api/" }

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 500
fail_on_revert = true
